:root{--bg:#f4f6f5;--card:#fff;--ink:#1d2a30;--mute:#5d6b70;--line:#dbe2df;--acc:#1f6f78;--accs:#e3f1f2;--ok:#2e7d4f;--oks:#e5f3ea;--bad:#b3452c;--bads:#fbe8e2;--warn:#a86400;--warns:#fff1d6;color-scheme:light}
*{box-sizing:border-box;font-feature-settings:"locl" 0,"tnum" 0,"lnum" 1}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DDNSarabun',Tahoma,sans-serif;font-size:20px;line-height:1.45}
button,input,select{font:inherit;color:var(--ink)}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 14px}
button:hover:not(:disabled){border-color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.danger{color:var(--bad);border-color:var(--bads)}
input{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{width:44px;height:44px}.top h1{font-size:24px;margin:0;line-height:1.2}.top .sub{font-size:16px;color:var(--mute)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.steps button{border-radius:999px;padding:4px 14px;font-size:18px}.steps button[aria-current=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.steps .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accs);color:var(--acc);font-size:14px;margin-right:6px;font-weight:700}
.steps button[aria-current=true] .n{background:#fff}
.sync{font-size:15px;border-radius:999px;padding:0 10px;white-space:nowrap;display:none;margin-left:6px;vertical-align:middle}
.sync.on{display:inline-block}.sync.busy{background:var(--accs);color:var(--acc)}.sync.ok{background:var(--oks);color:var(--ok)}.sync.bad{background:var(--bads);color:var(--bad)}
main{max-width:1180px;margin:0 auto;padding:16px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card h2{font-size:22px;margin:0}.muted{color:var(--mute);font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.stat b{font-size:28px;display:block;line-height:1.2}.stat span{font-size:16px;color:var(--mute)}
.stat.ok{background:var(--oks);border-color:#bfe0cb}.stat.warn{background:var(--warns);border-color:#f0d49a}
.hint{border-radius:10px;padding:10px 14px;background:var(--accs);font-size:18px}.hint.warn{background:var(--warns)}.hint.bad{background:var(--bads);color:var(--bad)}
.bars{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.bar{border-radius:10px;padding:8px 12px;border:1px solid var(--line)}.bar .t{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.bar .track{height:10px;border-radius:5px;background:#e8ecea;margin-top:6px;overflow:hidden}.bar .fill{height:100%;border-radius:5px;transition:width .25s}
.bar small{color:var(--mute);font-size:15px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:0 10px;font-size:15px;border:1px solid transparent;white-space:nowrap;line-height:1.7}
.chip.sel{font-weight:700;box-shadow:inset 0 0 0 2px currentColor}
.fil button{border-radius:999px;padding:2px 12px;font-size:16px}.fil button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fb{display:contents}
.list{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.it{display:grid;grid-template-columns:52px minmax(0,1.3fr) minmax(0,2fr) minmax(150px,auto);gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);text-align:left;border-radius:0;border-left:0;border-right:0;border-bottom:0;background:var(--card);width:100%;content-visibility:auto;contain-intrinsic-size:auto 66px}
.it:first-child{border-top:0}.it:hover{background:#f8faf9}
.it.pend{background:var(--warns)}.it .no{color:var(--mute);font-size:16px}
.it .nm b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.it .nm span{font-size:15px;color:var(--mute)}
.it .pf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:620px}.it .pf .chip{justify-content:center;overflow:hidden;text-overflow:ellipsis}.it .pf .chip.none{background:transparent;border:1px dashed var(--line);color:var(--mute)}.it .st{text-align:right;font-size:16px}
.st .s{font-weight:700;border-radius:8px;padding:0 10px;display:inline-block}.st small{display:block;color:var(--mute);font-size:14px}
.badge{border-radius:6px;padding:0 8px;font-size:15px;font-weight:700}
.b-in{background:#D9F2E0;color:#1e6b3b}.b-out{background:#D0E8F5;color:#154f75}.b-rin{background:#FFF2CC;color:#7a5a00}.b-rout{background:#FFE0B2;color:#8a4b00}
.b-pend{background:var(--warns);color:var(--warn)}.b-pick{background:#fbd6d6;color:#9b2c2c}
table{border-collapse:collapse;width:100%;font-size:18px}th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:center}th:first-child,td:first-child{text-align:left}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tabs button{border-radius:8px 8px 0 0;font-size:17px}
.log{font-size:16px}.log td{text-align:left;vertical-align:top}
.empty{padding:24px;text-align:center;color:var(--mute)}
.spin{width:22px;height:22px;border:3px solid var(--accs);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:18px;max-width:min(92vw,720px);display:none;z-index:60}
#toast.bad{background:var(--bad)}
.fil.sticky{position:sticky;top:var(--hh,72px);z-index:4;background:var(--card);margin:-14px -16px 0;padding:10px 16px;border-bottom:1px solid var(--line);border-radius:12px 12px 0 0;box-shadow:0 4px 8px -6px rgba(0,0,0,.15)}
#totop{position:fixed;right:16px;bottom:18px;z-index:40;border-radius:999px;padding:8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.15);display:none}
dialog{border:0;border-radius:14px;padding:0;width:min(640px,94vw);box-shadow:0 12px 40px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(0,0,0,.25)}

<script>
/* ===================== R4: กติกาบัญชีสำรองห้องเรียนพิเศษ — ใช้ร่วมกันทั้งเซิร์ฟเวอร์ (ไฟล์ Rules.gs) และหน้าเว็บ (index.html) =====================
   แก้กติกาที่ไฟล์นี้ที่เดียว แล้วสร้างหน้าเว็บใหม่ด้วย _สำหรับพัฒนา/ระบบ4_บัญชีสำรอง/src/build.py (ชุดทดสอบตรวจว่าโค้ดสองฝั่งตรงกันทุกตัวอักษร)
   เหตุการณ์ 1 รายการ = [0 เวลาบันทึก(ข้อความ), 1 ผู้บันทึก, 2 รหัสรายการ, 3 เลขที่สมัคร, 4 ห้อง, 5 เหตุผล/หมายเหตุ, 6 ชื่อ-สกุล,
                       7 ขั้นตอนขณะบันทึก, 8 เลขที่สมัครห้องปกติที่สละ (เฉพาะสำรองรับสิทธิ์), 9 ลำดับสำรอง, 10 เวลาบันทึก(ms), 11 เวลาที่เกิดจริง(ms)]
     เวลาที่เกิดจริง = เวลาที่ครูกดบนหน้าเว็บ (แม้ส่งถึงเซิร์ฟเวอร์ทีหลังเพราะเน็ตหลุด) — ใช้ตัดสินวันปิดรับสำรอง
   base = { rooms: [{code, title, q}], main: {เลขที่สมัคร: {room, k}}, res: {ห้อง: [เลขที่สมัครตามลำดับสำรอง]}, cfg: {dCut} }
   กติกา (ตกลงกับหัวหน้างานรับนักเรียน 7 ต.ค. 69):
     - บัญชีใครบัญชีมัน: ลำดับสำรองแยกต่อห้อง (ม.1 MEP/SMTE/GIFTED · ม.4 IEP/SMTE) เรียกตามลำดับเสมอ ห้ามข้าม
     - ที่ว่างของห้อง = ผู้สละสิทธิ์ (ที่สละก่อนหมดวันปิดรับสำรอง) − สำรองที่รับสิทธิ์แล้ว
     - เรียกแล้วไม่มา = บันทึกสละสิทธิ์ (เหตุผล "ไม่มารายงานตัว") ที่นั่งว่างอีกครั้ง → เรียกคนถัดไป
     - สำรองที่รับสิทธิ์โดยสละห้องเรียนปกติ (ช่อง 8) ยกเลิกผลการเรียกไม่ได้ (การสละห้องปกติย้อนไม่ได้) */
var R4 = (function () {
  var LB = { W: 'สละสิทธิ์', UW: 'ยกเลิกการสละสิทธิ์', RA: 'สำรองรับสิทธิ์', RD: 'สำรองไม่รับสิทธิ์', RN: 'ติดต่อสำรองไม่ได้', RU: 'ยกเลิกผลการเรียกสำรอง',
    P: 'รายงานตัวแล้ว', UP: 'ยกเลิกการรายงานตัว', E: 'มอบตัวแล้ว', UE: 'ยกเลิกการมอบตัว' };
  var STG = { pre: 'ก่อนรายงานตัว', rep: 'รายงานตัวแล้ว (ยังไม่มอบตัว)', enr: 'มอบตัวแล้ว', acc: 'สำรองรับสิทธิ์ (ยังไม่รายงานตัว)' };
  var DAY = 86400000;
  function s_(v) { return String(v == null ? '' : v).trim(); }
  function ymd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s_(s)); return m ? new Date(+m[1], +m[2] - 1, +m[3]).getTime() : 0; } // 00:00 ของวันนั้น (เวลาท้องถิ่น)
  function endOf(s) { var t = ymd(s); return t ? t + DAY : 0; } // หมดวันนั้น
  function t_(e) { return +e[11] || +e[10] || 0; } // เวลาที่เกิดจริง (ไม่มี = เวลาบันทึก)

  /** ดัชนี เลขที่สมัคร → {room, kind: 'm' (ตัวจริง) | 'r' (สำรอง), k: ลำดับ 1..} (คำนวณครั้งเดียวต่อ base) */
  function ix(base) {
    if (base._ix) return base._ix;
    var o = {};
    Object.keys(base.main || {}).forEach(function (id) { o[id] = { room: base.main[id].room, kind: 'm', k: base.main[id].k }; });
    Object.keys(base.res || {}).forEach(function (room) { (base.res[room] || []).forEach(function (id, i) { if (!o[id]) o[id] = { room: room, kind: 'r', k: i + 1 }; }); });
    try { Object.defineProperty(base, '_ix', { value: o, enumerable: false, configurable: true }); } catch (e) { base._ix = o; }
    return o;
  }
  function roomOf(base, id) { var x = ix(base)[id]; return x ? x.room : ''; }

  function fold(ev, base) {
    var st = { W: {}, R: {}, P: {}, E: {}, N: {}, L: {}, cut: endOf(base.cfg && base.cfg.dCut) };
    (ev || []).forEach(function (e) {
      var c = e[2], id = e[3];
      switch (c) {
        case 'W': st.W[id] = e; break;
        case 'UW': delete st.W[id]; break;
        case 'RA': case 'RD': case 'RN': st.R[id] = e; if (c === 'RA' && s_(e[8])) st.L[id] = s_(e[8]); else delete st.L[id]; break;
        case 'RU': delete st.R[id]; delete st.L[id]; break;
        case 'P': st.P[id] = e; break;
        case 'UP': delete st.P[id]; break;
        case 'E': st.E[id] = e; if (!st.P[id]) st.P[id] = e; break;
        case 'UE': delete st.E[id]; break;
      }
      if (e[5] && (c === 'W' || c === 'RA' || c === 'RD' || c === 'RN')) st.N[id] = e[5];
    });
    return st;
  }
  function isAcc(st, id) { var e = st.R[id]; return !!(e && e[2] === 'RA'); }
  function isMain(base, id) { return !!(base.main && base.main[id]); }
  function inList(st, base, id) { return isMain(base, id) || isAcc(st, id); }
  function active(st, base, id) { return inList(st, base, id) && !st.W[id]; }
  function stage(st, base, id) { return st.E[id] ? 'enr' : st.P[id] ? 'rep' : (isAcc(st, id) && !isMain(base, id)) ? 'acc' : 'pre'; }
  function counted(st, id) { var e = st.W[id]; return !!e && (!st.cut || !t_(e) || t_(e) < st.cut); } // สละก่อนหมดวันปิดรับสำรอง = เกิดที่ว่าง
  /** ที่นั่งของห้อง: w = ผู้สละที่ทำให้เกิดที่ว่าง · acc = สำรองที่รับสิทธิ์ · free = ที่ว่างให้เรียกสำรอง · seat = ผู้ที่ยังมีที่นั่ง */
  function seats(st, base, room) {
    var w = 0, wAll = 0, acc = 0, seat = 0;
    Object.keys(st.W).forEach(function (id) { if (roomOf(base, id) !== room) return; wAll++; if (counted(st, id)) w++; });
    Object.keys(st.R).forEach(function (id) { if (isAcc(st, id) && roomOf(base, id) === room) acc++; });
    Object.keys(base.main || {}).forEach(function (id) { if (base.main[id].room === room && !st.W[id]) seat++; });
    Object.keys(st.R).forEach(function (id) { if (isAcc(st, id) && !isMain(base, id) && roomOf(base, id) === room && !st.W[id]) seat++; });
    return { w: w, wAll: wAll, acc: acc, free: w - acc, seat: seat };
  }
  /** สำรองคนถัดไปที่ต้องโทรเรียก (คนแรกตามลำดับที่ยังไม่มีผล) · can = เรียกได้ตอนนี้ไหม · why = เหตุที่ยังเรียกไม่ได้ */
  function next(st, base, room, now) {
    var list = (base.res && base.res[room]) || [], i, x = seats(st, base, room);
    for (i = 0; i < list.length; i++) if (!st.R[list[i]]) break;
    if (i >= list.length) return { id: '', k: 0, can: false, why: list.length ? 'เรียกสำรองครบทุกคนแล้ว' : 'ห้องนี้ไม่มีรายชื่อสำรอง', free: x.free };
    var why = st.cut && (now || Date.now()) >= st.cut ? 'เลยวันปิดรับสำรองแล้ว' : x.free <= 0 ? 'ยังไม่มีที่ว่าง' : '';
    return { id: list[i], k: i + 1, can: !why, why: why, free: x.free };
  }

  /** ตรวจก่อนบันทึก · now = เวลาที่เกิดจริงของรายการนี้ · คืนข้อความผิดพลาด หรือ '' ถ้าบันทึกได้ */
  function check(st, base, p, now) {
    var t = p.t, id = s_(p.id), x, room, list, k;
    now = now || Date.now();
    if (!ix(base)[id]) return 'เลขที่สมัคร ' + id + ' ไม่อยู่ในรายชื่อตัวจริงหรือสำรองของห้องเรียนพิเศษ';
    room = roomOf(base, id);
    switch (t) {
      case 'W':
        if (!inList(st, base, id)) return id + ' เป็นรายชื่อสำรองที่ยังไม่ได้รับสิทธิ์ — ใช้ปุ่ม "ไม่รับสิทธิ์" ที่หน้าเรียกสำรองแทน';
        if (st.W[id]) return id + ' ถูกบันทึกสละสิทธิ์ไว้แล้ว';
        return '';
      case 'UW':
        if (!st.W[id]) return 'ไม่มีการสละสิทธิ์ของ ' + id;
        x = seats(st, base, room);
        if (counted(st, id) && x.acc > x.w - 1) return 'ยกเลิกไม่ได้ เพราะเรียกสำรองมาแทนที่นั่งนี้แล้ว — ยกเลิกผล "รับสิทธิ์" ของสำรองคนล่าสุดก่อน';
        return '';
      case 'RA':
        list = (base.res && base.res[room]) || []; k = list.indexOf(id);
        if (k < 0) return id + ' ไม่อยู่ในรายชื่อสำรอง';
        if (st.R[id]) return 'บันทึกผลของสำรองลำดับที่ ' + (k + 1) + ' ไว้แล้ว';
        for (var i = 0; i < k; i++) if (!st.R[list[i]]) return 'ต้องเรียกตามลำดับ — สำรองลำดับที่ ' + (i + 1) + ' ยังไม่ได้บันทึกผล';
        if (st.cut && now >= st.cut) return 'เลยวันปิดรับสำรองแล้ว (' + base.cfg.dCut + ') — ไม่เรียกสำรองเพิ่ม';
        x = seats(st, base, room);
        if (x.free <= 0) return 'ห้อง ' + room + ' ยังไม่มีที่ว่าง (สละสิทธิ์ ' + x.w + ' คน · สำรองรับสิทธิ์แล้ว ' + x.acc + ' คน)';
        return '';
      case 'RD': case 'RN':
        list = (base.res && base.res[room]) || []; k = list.indexOf(id);
        if (k < 0) return id + ' ไม่อยู่ในรายชื่อสำรอง';
        if (st.R[id]) return 'บันทึกผลของสำรองลำดับที่ ' + (k + 1) + ' ไว้แล้ว — กดยกเลิกผลก่อนถ้าต้องการแก้';
        return '';
      case 'RU':
        if (!st.R[id]) return 'ยังไม่มีผลการเรียกให้ยกเลิก';
        if (isAcc(st, id) && st.L[id]) return 'สำรองคนนี้รับสิทธิ์โดยสละห้องเรียนปกติ (' + st.L[id] + ') แล้ว — ยกเลิกไม่ได้ (ถ้าไม่มารายงานตัว ให้บันทึกสละสิทธิ์)';
        if (isAcc(st, id) && st.W[id]) return 'สำรองคนนี้ถูกบันทึกสละสิทธิ์แล้ว — ยกเลิกการสละสิทธิ์ก่อน';
        if (isAcc(st, id) && (st.P[id] || st.E[id])) return 'สำรองคนนี้รายงานตัว/มอบตัวแล้ว — ยกเลิกรายการนั้นก่อน';
        return '';
      case 'P': case 'E':
        if (!inList(st, base, id)) return id + ' ไม่อยู่ในรายชื่อตัวจริง หรือสำรองที่รับสิทธิ์แล้ว';
        if (st.W[id]) return id + ' สละสิทธิ์แล้ว';
        if (t === 'P' && st.P[id]) return id + ' บันทึกรายงานตัวไว้แล้ว';
        if (t === 'E' && st.E[id]) return id + ' บันทึกมอบตัวไว้แล้ว';
        return '';
      case 'UP':
        if (!st.P[id]) return 'ยังไม่ได้บันทึกรายงานตัว';
        if (st.E[id]) return 'มอบตัวแล้ว — ยกเลิกการมอบตัวก่อน';
        return '';
      case 'UE':
        return st.E[id] ? '' : 'ยังไม่ได้บันทึกมอบตัว';
    }
    return 'รายการไม่ถูกต้อง';
  }

  /* ---------- เทียบชื่อ-สกุลข้ามระบบ (เลขที่สมัครห้องพิเศษกับห้องปกติเป็นคนละชุด) ---------- */
  var PFX = /^(เด็กหญิง|เด็กชาย|นางสาว|นาย|นาง|ด\.ญ\.|ด\.ช\.|น\.ส\.|ดญ\.?|ดช\.?)\s*/;
  var ch = String.fromCharCode, ZW = new RegExp('[' + ch(0x200b) + '-' + ch(0x200d) + ch(0xfeff) + ']', 'g'), // อักขระซ่อน
    EE = new RegExp(ch(0x0e40, 0x0e40), 'g'), AE = ch(0x0e41), AM2 = new RegExp(ch(0x0e4d, 0x0e32), 'g'), AM = ch(0x0e33); // เเ→แ · ํ+า→ำ
  function norm(s) { // ตัดช่องว่าง/อักขระซ่อน · แก้รูปที่พิมพ์ต่างกันบ่อย (เเ→แ · ํา→ำ)
    return s_(s).replace(ZW, '').replace(/\s+/g, '').replace(EE, AE).replace(AM2, AM);
  }
  function nameKey(fn, ln) { return norm(s_(fn).replace(PFX, '')) + '|' + norm(ln); }
  function split(full) { // "เด็กหญิงสมใจ ใจดี" → [คำนำหน้า, ชื่อ, นามสกุล]
    var s = s_(full).replace(/\s+/g, ' '), m = PFX.exec(s), p = m ? m[1] : '';
    s = s.slice(m ? m[0].length : 0).trim();
    var i = s.indexOf(' ');
    return i < 0 ? [p, s, ''] : [p, s.slice(0, i), s.slice(i + 1).trim()];
  }
  function dist(a, b) { // ระยะแก้ไข (หยุดเมื่อเกิน 2)
    if (Math.abs(a.length - b.length) > 2) return 3;
    var prev = [], cur, i, j;
    for (j = 0; j <= b.length; j++) prev[j] = j;
    for (i = 1; i <= a.length; i++) {
      cur = [i];
      for (j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  /** 'exact' = ชื่อและนามสกุลตรงกัน · 'near' = ต่างกันเล็กน้อย (สะกด/วรรณยุกต์ 1 ตัว หรือชื่อตรงแต่นามสกุลต่าง 1 ตัว) · '' = ไม่ใช่ */
  function same(k1, k2) {
    if (!k1 || !k2 || k1 === '|' || k2 === '|') return '';
    if (k1 === k2) return 'exact';
    var a = k1.split('|'), b = k2.split('|');
    if (a[0].length < 2 || b[0].length < 2) return '';
    var df = dist(a[0], b[0]), dl = dist(a[1], b[1]);
    if (df + dl <= 1) return 'near';
    if (df === 0 && dl <= 2 && a[1].length >= 4) return 'near';
    if (dl === 0 && df <= 2 && a[0].length >= 4) return 'near';
    return '';
  }

  /** รายชื่อจากแท็บ "รายชื่อ" ([ห้อง, 'm'|'r', ลำดับ, เลขที่สมัคร, …]) → base */
  function build(list, rooms, cfg) {
    var b = { rooms: rooms || [], main: {}, res: {}, cfg: cfg || {} }, tmp = {};
    (rooms || []).forEach(function (r) { tmp[r.code] = []; });
    (list || []).forEach(function (r) {
      var room = s_(r[0]), id = s_(r[3]); if (!room || !id) return;
      if (r[1] === 'm') b.main[id] = { room: room, k: +r[2] || 0 };
      else (tmp[room] = tmp[room] || []).push([+r[2] || 0, id]);
    });
    Object.keys(tmp).forEach(function (room) { b.res[room] = tmp[room].sort(function (x, y) { return x[0] - y[0]; }).map(function (x) { return x[1]; }); });
    return b;
  }

  return { LB: LB, build: build, STG: STG, ymd: ymd, endOf: endOf, t: t_, ix: ix, roomOf: roomOf, fold: fold, isAcc: isAcc, isMain: isMain, inList: inList,
    active: active, stage: stage, counted: counted, seats: seats, next: next, check: check, norm: norm, nameKey: nameKey, split: split, same: same };
})();

</script>
<script>
/* ============================================================

function flowTxt(node, tail) {
  var t = node.nodeValue, parts = [];
  if (tail && SEG) { // คำสุดท้าย 2 คำ (ความยาวรวมไม่เกิน 26 ตัวอักษร) ผูกกัน ไม่ให้เหลือคำเดียวโดดๆ ท้ายย่อหน้า

    var k = w.length >= 2 ? w[w.length - 2] : -1;
    var mm; NB_RE.lastIndex = 0; while ((mm = NB_RE.exec(t))) { if (k > mm.index && k < mm.index + mm[0].length) { k = mm.index; break; } }
    if (k > 0 && t.replace(/\s+$/, '').length - k <= 32) { parts.push([t.slice(0, k), 0], [t.slice(k), 1]); }
  }
  if (!parts.length) parts.push([t, 0]);
  var frag = document.createDocumentFragment(), did = !!SEG;
  parts.forEach(function (pt) {
    var host = frag;
    if (pt[1]) { host = document.createElement('span'); host.className = 'nb'; frag.appendChild(host); did = true; }
    var last = 0, m; NB_RE.lastIndex = 0;
    while ((m = NB_RE.exec(pt[0]))) {
      if (m.index > last) addPlain(host, pt[0].slice(last, m.index));
      var sp = document.createElement('span'); sp.className = 'nb'; sp.textContent = m[0]; host.appendChild(sp); did = true; last = m.index + m[0].length;
    }
    if (last < pt[0].length) addPlain(host, pt[0].slice(last));
  });
  if (did) node.parentNode.replaceChild(frag, node);
}
function flow(root) {
  [].slice.call(root.querySelectorAll('.pg p, .pg .h, .pg .dl, .pg .pt')).forEach(function (el) {
    var tx = [], wk = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null), n;
    while ((n = wk.nextNode())) if (n.nodeValue.trim()) tx.push(n);
    FLOWJ = typeof DDNJUST !== 'undefined' && DDNJUST.ok && el.matches(DDNJUST.sel);
    tx.forEach(function (n, i) { flowTxt(n, i === tx.length - 1 && el.matches('p, .h')); });
  });
  FLOWJ = false;
  if (typeof DDNJUST !== 'undefined') DDNJUST.run(root); // จัดบรรทัดกระจายแบบไทย (ddn_just.js) — ย่อหน้าที่ยังซ่อนอยู่จะจัดเมื่อแสดง
}

}
